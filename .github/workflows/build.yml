name: Build Firmware

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    # Always build on PRs targeting main/develop, or on manual dispatch.
    # For plain pushes, only build when the commit message opts in with "[build]".
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build]'))
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Generate .hex / .bin
        working-directory: build/${{ matrix.preset }}
        run: |
          ELF=$(find . -maxdepth 1 -name '*.elf' | head -n1)
          echo "ELF file: $ELF"
          arm-none-eabi-objcopy -O ihex "$ELF" "${ELF%.elf}.hex"
          arm-none-eabi-objcopy -O binary "$ELF" "${ELF%.elf}.bin"

      - name: Print firmware size
        working-directory: build/${{ matrix.preset }}
        run: |
          ELF=$(find . -maxdepth 1 -name '*.elf' | head -n1)
          arm-none-eabi-size "$ELF"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32f4-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/*.elf
            build/${{ matrix.preset }}/*.hex
            build/${{ matrix.preset }}/*.bin
            build/${{ matrix.preset }}/*.map
          if-no-files-found: error
          retention-days: 14

  # Runs on the local self-hosted runner (labels: self-hosted, stm32-local) instead of
  # a GitHub-hosted VM. Placeholder for the GHS dongle toolchain: for now it reuses the
  # same arm-none-eabi-gcc/CMake/Ninja already installed on that machine's PATH, so we
  # can validate the self-hosted plumbing before swapping in the licensed GHS compiler.
  #
  # Triggered by: push to any branch with "[build]" in the commit message, any
  # pull_request targeting main/develop, workflow_dispatch, or a PR comment containing
  # "[build]" (issue_comment) posted by someone with write access (OWNER/MEMBER/
  # COLLABORATOR) — restricted because this runs arbitrary repo code on the local
  # machine, see doc/GithubActions/GithubActions_Setup.md section 9.7.
  build-self-hosted:
    name: Build on local runner (${{ matrix.preset }})
    runs-on: [self-hosted, stm32-local]
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build]')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '[build]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    defaults:
      run:
        shell: powershell
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]

    steps:
      # issue_comment events don't carry a ref to the PR's branch by default, so it
      # must be resolved explicitly. For push/pull_request/workflow_dispatch, github.ref
      # already points at the right commit (same as omitting `ref` entirely).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Build (${{ matrix.preset }})
        run: |
          & .\build.bat ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32f4-${{ matrix.preset }}-local
          path: |
            build/${{ matrix.preset }}/*.elf
            build/${{ matrix.preset }}/*.hex
            build/${{ matrix.preset }}/*.bin
            build/${{ matrix.preset }}/*.map
          if-no-files-found: error
          retention-days: 14
